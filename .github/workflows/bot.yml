# Simulated trading bot (scripts/bot.mjs): every day at 21:30 (Brasília), after the B3 and US close
# and after crypto's day (UTC) ends at 21:00, replays the closed candles and publishes
# relatorios/bot/ (resultado.json and the day trade history). It also runs
# right after the value or the modes are chosen on the site (that saves relatorios/config.json).
name: Bot (simulação)

on:
  schedule:
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths: ["relatorios/config.json", "scripts/bot.mjs", "scripts/tecnica-lib.mjs", "lib/bot-regras.js"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relatorios
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simular
        run: node scripts/bot.mjs
      - name: Publicar
        run: |
          git config user.name "radar-mercado-bot"
          git config user.email "radar-mercado-bot@users.noreply.github.com"
          git add relatorios/bot/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Bot: simulação de $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
