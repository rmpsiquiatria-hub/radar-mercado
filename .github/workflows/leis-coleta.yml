# Radar de leis, step 1 — weekdays 21:00 (Brasília): lists the day's acts in the federal, RS and
# Lajeado gazettes (scripts/leis-coleta.mjs). The Claude routine analyses them at 05:00 and the
# e-mail goes out on its push (leis-email.yml).
# The day collected is "now minus 9 hours" in Brasília, so a run GitHub delays past midnight still
# picks the right day.
name: Radar de leis - coleta

on:
  schedule:
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia a coletar (AAAA-MM-DD); vazio = automático"
        required: false

permissions:
  contents: write

concurrency:
  group: leis
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Coletar
        run: |
          dia="${{ github.event.inputs.dia }}"
          [ -n "$dia" ] || dia=$(TZ=America/Sao_Paulo date -d "9 hours ago" +%F)
          node scripts/leis-coleta.mjs "$dia"
      - name: Publicar
        run: |
          git config user.name "radar-mercado-bot"
          git config user.email "radar-mercado-bot@users.noreply.github.com"
          git add relatorios/leis/coleta.json relatorios/leis/textos/
          git diff --cached --quiet && exit 0
          git commit -m "Radar de leis: coleta de $(node -p "require('./relatorios/leis/coleta.json').data")"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
