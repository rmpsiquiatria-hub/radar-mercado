# Radar de leis, step 3: sends the e-mail for the day collected in relatorios/leis/coleta.json.
# - When the Claude routine pushes the analysis (relatorios/leis/ultimo.json), it waits until 07:15
#   (Brasília) and sends; a push after 07:15 sends right away.
# - At 07:35 (Brasília, every day) a scheduled run sends the plain list if nothing went out for that
#   day (the routine failed or GitHub delayed the collection).
# - "Run workflow" by hand sends immediately.
# - A recovered day (relatorios/leis/atrasados/<dia>/) gets its own e-mail once analysed; its folder is
#   then removed, which is what keeps it from being sent twice.
# relatorios/leis/email-enviado.txt records the last collection e-mailed (day + collection time: a day
# collected again, e.g. because Lajeado published late, is analysed and sent again).
name: Radar de leis - e-mail

on:
  push:
    branches: [main]
    paths: [relatorios/leis/ultimo.json, "relatorios/leis/atrasados/*/ultimo.json"]
  schedule:
    - cron: "35 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leis-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esperar até 07:15 (Brasília)
        if: github.event_name == 'push'
        run: |
          target=$(TZ=America/Sao_Paulo date -d "today 07:15" +%s)
          wait=$(( target - $(date +%s) ))
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 10800 ]; then echo "Esperando ${wait}s"; sleep "$wait"; fi
          git pull --rebase
      - name: Enviar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          git config user.name "radar-mercado-bot"
          git config user.email "radar-mercado-bot@users.noreply.github.com"
          publicar() {
            git add -A relatorios/leis/
            git commit -m "$1" || return 0
            for i in 1 2 3; do git pull --rebase && git push && return 0; sleep 10; done
            return 1
          }
          do_dia() {
            [ -f relatorios/leis/coleta.json ] || { echo "Sem coleta."; return 0; }
            dia=$(node -p "require('./relatorios/leis/coleta.json').data")
            chave=$(node -p "const c=require('./relatorios/leis/coleta.json'); c.data+' '+c.coletado_em")
            sent=$(cat relatorios/leis/email-enviado.txt 2>/dev/null || true)
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              [ "$sent" != "$chave" ] || { echo "Coleta $chave já enviada."; return 0; }
              # an old collection (the 21:00 run did not happen) is not worth an e-mail
              [ ! "$dia" \< "$(TZ=America/Sao_Paulo date -d '3 days ago' +%F)" ] || { echo "Coleta antiga ($dia)."; return 0; }
            fi
            node scripts/leis-email.mjs || return 1
            echo "$chave" > relatorios/leis/email-enviado.txt
            publicar "Radar de leis: e-mail de $dia enviado"
          }
          falhou=0
          do_dia || falhou=1
          # recovered days: one e-mail for each one already analysed
          for pasta in relatorios/leis/atrasados/*/; do
            [ -f "${pasta}ultimo.json" ] || continue
            d=$(basename "$pasta")
            if node scripts/leis-email.mjs --dia "$d"; then
              rm -rf "$pasta"
              publicar "Radar de leis: e-mail do dia recuperado $d enviado" || falhou=1
            else falhou=1; fi
          done
          exit $falhou
